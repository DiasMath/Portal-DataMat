name: CD - Deploy to LocalWeb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Deploy to LocalWeb via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LOCALWEB_HOST }}
          username: ${{ secrets.LOCALWEB_USERNAME }}
          password: ${{ secrets.LOCALWEB_PASSWORD }}
          port: ${{ secrets.LOCALWEB_PORT || 22 }}
          script: |
            # Navegar para o diretório do projeto
            cd ${{ secrets.LOCALWEB_PROJECT_PATH }}
            
            # Parar o servidor atual
            pm2 stop analise-frontend || true
            
            # Fazer pull das últimas alterações
            git pull origin main
            
            # Instalar dependências
            npm ci
            
            # Build do projeto
            npm run build
            
            # Reiniciar o servidor com PM2
            pm2 restart analise-frontend || pm2 start npm --name "analise-frontend" -- start
            
            # Salvar configuração do PM2
            pm2 save

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deploy realizado com sucesso para LocalWeb!"
          else
            echo "❌ Falha no deploy para LocalWeb"
          fi
